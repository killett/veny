name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check build twine

      - name: Build sdist and wheel
        run: python -m build

      # veny's version is a static string in src/veny/__init__.py, not derived
      # from the tag, so the two can disagree: tag v0.2.3 while __init__.py
      # still reads 0.2.2 and the build cheerfully produces veny-0.2.2. PyPI
      # filenames are immutable, so publishing the wrong one burns that
      # version number permanently. Fail here instead, before the publish job
      # can run.
      - name: Assert the tag matches __version__
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(python -c 'import sys; sys.path.insert(0, "src"); import veny; print(veny.__version__)')"
          echo "tag=${tag}  __version__=${version}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::tag ${tag} does not match veny.__version__ ${version} (expected v${version})"
            exit 1
          fi
          test -f "dist/veny-${version}.tar.gz"
          test -f "dist/veny-${version}-py3-none-any.whl"

      # veny is pure Python. A platform-tagged wheel here would mean something
      # went wrong in the build, and would publish an artifact most users
      # could not install.
      - name: Assert the wheel is pure Python
        run: |
          set -euo pipefail
          ls dist/
          test -n "$(ls dist/*-py3-none-any.whl)"

      - name: twine check
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token exists.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
