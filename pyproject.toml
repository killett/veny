[project]
name = "veny"
dynamic = ["version"]  # Single-sourced from src/veny/__init__.py by hatchling.
description = "Run a Python script in a virtual environment built from its imports."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["emmykit>=0.4.0,<1.0", "uv>=0.9,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
veny = "veny.cli:main"

[tool.hatch.version]
path = "src/veny/__init__.py"
pattern = "__version__[^=]*= ['\"](?P<version>[^'\"]*)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["src/veny"]

[tool.ruff]
# This ruff formats Python code blocks inside Markdown. docs/ holds design docs
# and implementation plans whose code blocks are a record of what the code was
# at approval time -- reformatting them silently rewrites history. A bare
# `ruff format .` rewrote 696 lines across eight of them before this exclusion.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes — unused imports, undefined names, etc.
    "E",      # pycodestyle errors (subset — see ignores below)
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear
    "B9",     # bugbear opinionated rules
    "UP",     # pyupgrade — modernize syntax to latest Python
    "I",      # isort — import ordering
    "ANN",    # flake8-annotations — enforce type hints
    "D",      # enable the pydocstyle rules
    "S",      # bandit — security linter (subset — see ignores below)
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package (__init__.py)
    "ANN204", # missing return type annotation for __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S"]  # Otherwise Claude would either over-annotate every test or fight ruff constantly.
# cli.py's asserts are internal invariants, not input validation; its
# subprocess calls are the whole point of the program (it builds venvs and
# runs the user's script). Scoped to this one file so a genuinely unsafe call
# elsewhere still gets flagged. (The pickle.load call this used to also cover
# moved to analysis/custom_modules.py in plan 3a, which carries its own
# inline `# noqa: S301` instead.)
"src/veny/cli.py" = ["S101", "S603"]
# environment.py is the one module that invokes uv: its subprocess calls
# are its entire purpose. It carries no asserts, so S101 stays enforced here.
"src/veny/environment.py" = ["S603"]
# verify.py runs the venv's own interpreter to prove what it can import --
# the same "the subprocess is the point" case as cli.py, moved here verbatim
# from it. It carries no asserts, so S101 stays enforced here.
"src/veny/verify.py" = ["S603"]
# cache_search.py probes a cached venv's own interpreter for the versions it
# has installed -- the same "the subprocess is the point" case as verify.py,
# moved here verbatim from cli.py. It carries no asserts, so S101 stays
# enforced here.
"src/veny/cache_search.py" = ["S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# Uncomment when using rasterio or netCDF4:
# [[tool.mypy.overrides]]
# module = ["rasterio.*", "netCDF4.*"]
# ignore_missing_imports = true

[[tool.mypy.overrides]]  # Tests often have untyped functions and use dynamic features, so relax mypy rules for them.
module = ["tests.*"]
strict = false
warn_return_any = false
# Claude Opus 4.7 says: the test override has strict = false but that doesn't disable specific checks already enabled globally. So we also need to disable these individually:
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

# pixi is used for package management, but if you switch to using uv, it's a good idea to uncomment these lines for security.
# [tool.uv]
# exclude-newer = "7 days"
