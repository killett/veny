[project]
name = "veny"
dynamic = ["version"]  # Single-sourced from src/veny/__init__.py by hatchling.
description = "Run a Python script in a virtual environment built from its imports."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["emmykit>=0.4.0,<1.0", "uv>=0.9,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
veny = "veny.cli:main"

[tool.hatch.version]
path = "src/veny/__init__.py"
pattern = "__version__[^=]*= ['\"](?P<version>[^'\"]*)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["src/veny"]

[tool.ruff]
# This ruff formats Python code blocks inside Markdown. docs/ holds design docs
# and implementation plans whose code blocks are a record of what the code was
# at approval time -- reformatting them silently rewrites history. A bare
# `ruff format .` rewrote 696 lines across eight of them before this exclusion.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes — unused imports, undefined names, etc.
    "E",      # pycodestyle errors (subset — see ignores below)
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear
    "B9",     # bugbear opinionated rules
    "UP",     # pyupgrade — modernize syntax to latest Python
    "I",      # isort — import ordering
    "ANN",    # flake8-annotations — enforce type hints
    "D",      # enable the pydocstyle rules
    "S",      # bandit — security linter (subset — see ignores below)
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package (__init__.py)
    "ANN204", # missing return type annotation for __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S"]  # Otherwise Claude would either over-annotate every test or fight ruff constantly.
# cli.py's asserts are internal invariants, not input validation; its
# subprocess calls are the whole point of the program (it builds venvs and
# runs the user's script). Scoped to this one file so a genuinely unsafe call
# elsewhere still gets flagged. (The pickle.load call this used to also cover
# moved to analysis/custom_modules.py in plan 3a, which carries its own
# inline `# noqa: S301` instead.)
"src/veny/cli.py" = ["S101", "S603"]
# pipeline.py carries the asserts and the subprocess call moved out of
# cli.py: list_packages' and setup_virtualenv's internal-invariant asserts,
# and run_script's launch of the user's own script -- which is the whole
# point of the program, the same reasoning cli.py's entry carried. Scoped to
# this one file so a genuinely unsafe call elsewhere still gets flagged.
"src/veny/pipeline.py" = ["S101", "S603"]
# environment.py is the one module that invokes uv: its subprocess calls
# are its entire purpose. It carries no asserts, so S101 stays enforced here.
"src/veny/environment.py" = ["S603"]
# verify.py runs the venv's own interpreter to prove what it can import --
# the same "the subprocess is the point" case as cli.py, moved here verbatim
# from it. It carries no asserts, so S101 stays enforced here.
"src/veny/verify.py" = ["S603"]
# cache_search.py probes a cached venv's own interpreter for the versions it
# has installed -- the same "the subprocess is the point" case as verify.py,
# moved here verbatim from cli.py. It carries no asserts, so S101 stays
# enforced here.
"src/veny/cache_search.py" = ["S603"]
# The 3d differential driver speaks to two differently-shaped source trees
# through module handles it imports by name, so every veny object it touches is
# genuinely of unknown static type -- ANN401 has nothing better to offer than
# `Any` here, and annotating these as the pre-3d types would be a lie about the
# post-3d tree (and vice versa). S606 is its one os.execv, which exists solely
# to restart the process with PYTHONHASHSEED=0 set before the interpreter
# starts; it re-runs this same file with this same interpreter.
"scripts/differential_3d.py" = ["ANN401", "S606"]
# The 3e differential driver has the same two reasons as 3d's, for the same
# two causes: it speaks to two differently-shaped source trees through module
# handles it imports by name, so `Any` is the honest annotation for every veny
# object it touches, and its one os.execv re-runs this same file with this same
# interpreter to get PYTHONHASHSEED=0 set before the interpreter starts.
"scripts/differential_3e.py" = ["ANN401", "S606"]
# The 4a differential reuses 3e's harness, so it inherits both reasons: `Any`
# for every object it reaches through 3e's module handles, and one os.execv
# that re-runs this same file to get PYTHONHASHSEED=0 before the interpreter
# starts. (It cannot call 3e's re-exec: that one re-execs 3e's own __file__,
# which silently runs 3e's seven layers instead of these twelve.)
"scripts/differential_4a.py" = ["ANN401", "S606"]
# The 4b differential reuses 4a's driver, which reuses 3e's harness, so it
# inherits both reasons a third time: `Any` for every object it reaches through
# those module handles -- and one more tree shape to speak to, since 4b deleted
# `run_options.py` -- and one os.execv that re-runs this same file to get
# PYTHONHASHSEED=0 before the interpreter starts. (It cannot call 4a's or 3e's
# re-exec: each re-execs its own __file__, which would silently run that
# phase's layers instead of these eighteen.)
"scripts/differential_4b.py" = ["ANN401", "S606"]
# The 4c differential reuses 4b's driver, which reuses 4a's and 3e's, so it
# inherits both reasons a fourth time: `Any` for every object it reaches
# through those module handles -- and one more attribute to speak to across
# two shapes, since 4c deletes `last_used.is_virtualenv` -- and one os.execv
# that re-runs this same file to get PYTHONHASHSEED=0 before the interpreter
# starts. (It cannot call 4b's, 4a's or 3e's re-exec: each re-execs its own
# __file__, which would silently run that phase's layers instead of these
# twenty-two.)
"scripts/differential_4c.py" = ["ANN401", "S606"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# Uncomment when using rasterio or netCDF4:
# [[tool.mypy.overrides]]
# module = ["rasterio.*", "netCDF4.*"]
# ignore_missing_imports = true

[[tool.mypy.overrides]]  # Tests often have untyped functions and use dynamic features, so relax mypy rules for them.
module = ["tests.*"]
strict = false
warn_return_any = false
# Claude Opus 4.7 says: the test override has strict = false but that doesn't disable specific checks already enabled globally. So we also need to disable these individually:
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

# pixi is used for package management, but if you switch to using uv, it's a good idea to uncomment these lines for security.
# [tool.uv]
# exclude-newer = "7 days"
