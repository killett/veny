# pixi manifest for veny's development environment.
#
# Generated from a project-scaffolding template, which is where the
# "scaffold baseline" block in [dependencies] comes from. veny's own runtime
# dependencies are emmykit and uv (pyproject.toml); nothing in this file is
# needed to run veny -- see README.md, "Working on veny itself".

[workspace]
name = "veny"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
exclude-newer = "7d"

# To urgently bypass the cooldown for a CVE fix, add:
# [exclude-newer]
# affected-package = "0d"

# Cooldown exemption for PyPI packages. emmykit -- the only entry under
# [pypi-dependencies] -- is first-party (github.com/killett/emmykit) and is
# veny's utility layer, so a release of it is not the third-party supply-chain
# risk the 7-day cooldown exists to absorb, and waiting a week would strand the
# emmykit migration half-done. The conda cooldown above is untouched and still
# governs every conda-forge dependency.
#
# Note for whoever edits this next: on pixi 0.69 the per-package cooldown
# override for a PyPI package is the `[pypi-exclude-newer]` table below, keyed
# by package name. The `[exclude-newer]` table named in the comment above is
# not accepted, and neither is `exclude-newer-package` (that spelling is uv's,
# leaking through pixi's bundled resolver's error hint). A wrong spelling is
# not always rejected outright -- `pixi update` can simply report "Lock-file
# was already up-to-date" and silently leave the old version pinned.
[pypi-exclude-newer]
emmykit = "0d"

[dependencies]
python = ">=3.12,<3.14"
ruff = "*"
mypy = "*"
pytest = "*"
pytest-cov = "*"
pre-commit = "*"
# Scaffold baseline, carried over from the template. None of it is a runtime
# dependency of veny.
python-dotenv = "*"
httpx = "*"
pydantic = "*"
typer = "*"
rich = "*"
stamina = "*"
openjdk = "=25"
ipython = "*"
ipdb = "*"
py-spy = "*"
shellcheck = "*"
go-shfmt = "*"
taplo = "*"
git-delta = "*"
difftastic = "*"
hyperfine = "*"
go-yq = "*"
vermin = "*"
python-build = "*"
hatchling = "*"
hatch-vcs = "*"
twine = "*"

[pypi-dependencies]
emmykit = ">=0.4.0, <1.0"
uv = ">=0.9, <1.0"

# Conda deps that only resolve on linux-64. Use this section when a
# package or one of its conda-forge dependencies has no osx-arm64 build,
# so the cross-platform solve fails on macOS. Symptom of belonging here:
# `pixi add <pkg>` fails with "No candidates were found" on osx-arm64.
# Known offenders today:
#   - pngquant (no osx-arm64) → drags ocrmypdf with it
#   - pytorch-cuda (CUDA runtime, linux-only)
# Empty section is valid TOML and pixi accepts it as "no extras".
[target.linux-64.dependencies]


# Make `python -m <package>` work inside `pixi run` and `pixi shell` without an editable install. Avoids dragging uv + a build backend into the loop, which is fragile if any parent directory has a pyproject.toml that isn't PEP 621-valid.
[activation.env]
PYTHONPATH = "src"

[tasks]
# On macOS, pixi-installed tools (pytest, ruff, mypy) can fail due to shebang path resolution issues. Using python -m <tool> bypasses this reliably.
test = "python -m pytest"
test-cov = "python -m pytest --cov"  # Later on, consider adding --cov-fail-under=80
lint = "python -m ruff check ."
format = "python -m ruff format ."
typecheck = "python -m mypy ."
# Run veny from the working tree. PYTHONPATH=src is already exported by
# [activation.env], so no editable install is needed inside pixi.
veny = "python -m veny"
# Build the sdist + wheel. python-build and hatchling are already pinned in
# [dependencies].
build = "python -m build"
# Install the built wheel into a throwaway venv and prove the console script
# works. Needs the network; deliberately not part of `pixi run test`.
smoke = "bash scripts/smoke-install.sh"
# pre-commit lives in the pixi env (see [dependencies] above) so its tools
# stay pinned and exclude-newer-governed like everything else. Same `python -m`
# shebang dodge as the tasks above. -install wires .git/hooks/pre-commit, but
# read PROGRESS.md's Gotchas before running it here: the mypy hook checks the
# whole tree, so with its standing errors an installed hook refuses every
# commit that stages a .py file.
#
# `pre-commit` is a pure pass-through: `pixi run pre-commit <args>` is
# identical to invoking the upstream `pre-commit <args>` CLI, since pixi
# forwards trailing argv to the task command. Examples:
#   pixi run pre-commit run                         # staged files
#   pixi run pre-commit run --files path/to/file    # scope to one file
#   pixi run pre-commit run --all-files             # whole repo
#   pixi run pre-commit install                     # wire .git/hooks
#   pixi run pre-commit autoupdate                  # bump hook revs
# The `-all` and `-install` aliases below are short-hands for the two
# most common one-shot workflows — they exist for muscle memory, not
# because the pass-through can't reach them.
pre-commit = "python -m pre_commit"
pre-commit-all = "python -m pre_commit run --all-files"
pre-commit-install = "python -m pre_commit install --install-hooks"
